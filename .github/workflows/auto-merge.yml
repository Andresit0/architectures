name: Auto-merge Dependabot

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge patch/minor dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event.pull_request.base.ref == 'develop'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          alert-lookup: true

      - name: Enable auto-merge on patch/minor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          case "$UPDATE_TYPE" in
            version-update:semver-patch|version-update:semver-minor)
              gh pr merge "$PR_URL" --auto --squash
              echo "Auto-merge enabled for $UPDATE_TYPE"
              ;;
            *)
              echo "Skipping auto-merge for $UPDATE_TYPE (requires review)"
              ;;
          esac
