name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  analyze:
    name: Analyze
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
      - run: flutter pub get
      - run: flutter analyze

  test:
    name: Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
      - run: flutter pub get
      - run: flutter test --coverage
      - name: Install lcov (coverage tool)
        run: brew install lcov
      - name: Check coverage threshold
        run: |
          lcov --summary coverage/lcov.info 2>&1 | head -5 || true
          lines=$(lcov --summary coverage/lcov.info 2>&1 | grep "lines......" | awk '{print $2}' | tr -d '%' || echo "0")
          if (( $(echo "$lines < 70" | bc -l) )); then
            echo "Coverage $lines% is below threshold 70%"
            exit 1
          fi
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
      - run: flutter pub get
      - run: flutter build ios --no-codesign

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: [analyze, test]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
      - run: flutter pub get
      - run: flutter build apk --debug
